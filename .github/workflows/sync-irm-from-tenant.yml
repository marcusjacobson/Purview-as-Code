name: sync-irm-from-tenant

# Reverse drift-detection companion to deploy-irm.yml, the per-solution
# forward-apply workflow for the Insider Risk Management (IRM) policy
# surface (ADR 0051). Detects portal-only edits to the
# Microsoft Purview Insider Risk Management policy surface in the
# target tenant (selected environment) and opens (or refreshes) a GitHub
# ISSUE describing the drift.
#
# ISSUE, not PR -- and no longer because the reconciler cannot export.
# This workflow was built when IRM was a Tier-3 (export-incapable)
# surface. That is no longer true: scripts/Deploy-IRMPolicies.ps1 gained
# -ExportCurrentState under issue #177, and deploy-irm.yml gained the
# full two-pass portal-wins enumerate plus a drift-back PR job, so IRM
# left the validate.yml full-circle exempt list.
#
# This reverse leg deliberately still opens an ISSUE, and the reason has
# changed since it was written. The original blocker was the ADR 0036
# skip baseline: the four operator-authored `IRM Lab — *` policies were
# ratified as permanently skipped and were absent from
# data-plane/irm/policies.yaml, so an export-and-diff would have proposed
# ADDING all four every single day, defeating the baseline's purpose.
# That blocker is GONE -- the #177 scope decision codified all four (they
# now read NoChange, which makes the post-filter below inert for them).
#
# What keeps this leg issue-based now is that it is no longer the only
# producer on this surface, and a schedule is the worst of the three to
# let write YAML:
#   * deploy-irm.yml opens a drift-back PR on
#     auto/irm-portal-wins-drift-<env> whenever its portal-wins apply
#     skips something -- push- or dispatch-triggered, so a human already
#     caused it.
#   * scripts/Invoke-LocalIrmDriftSync.ps1 opens one on
#     auto/irm-drift-sync-<env> for a governance-locked tenant no
#     workflow can reach -- operator-run, so a human is present.
#   * this workflow fires unattended on a daily cron. A third producer
#     racing the other two for the same file, with nobody watching, buys
#     no coverage the other two lack.
#
# One asymmetry survives and would have to be handled by any future
# conversion: this job post-filters the ADR 0036 baseline out of the
# drift rows, whereas the exporter captures every tenant policy except
# IRM_Tenant_Setting_*. An export-and-diff would need to re-apply that
# filter to the exported YAML before diffing, or it would propose changes
# this job deliberately ignores.
#
# So this workflow runs the reconciler in read-only ADR 0029 audit mode,
# post-filters the baseline out, and opens a GitHub issue so a human
# decides how to reconcile (accept into YAML, overwrite the portal via
# deploy-irm.yml repo-wins, ratify via an ADR, or let one of the two
# PR-opening producers above carry it).
#
# This is the reverse leg the companion-workflow rule in
# .github/instructions/github-actions.instructions.md requires; the
# forward apply leg is deploy-irm.yml, which owns this surface and
# nothing else and is gated by its own ADR 0029 contract.
#
# Note the drift-back branches never collide: deploy-irm.yml's push-time
# job uses auto/irm-portal-wins-drift-<env>, Invoke-LocalIrmDriftSync.ps1
# uses auto/irm-drift-sync-<env>, and any future PR shape here would use
# a third name, so no two mechanisms can fight over one branch.
#
# Why not the generic drift-detection.yml: that workflow greps a
# "Plan: N adds/updates/removes" banner these compliance-plane
# reconcilers never emit (Deploy-IRMPolicies.ps1 returns a categorized
# object table, not a plan banner) and captures with 2>&1, which mixes
# the Information stream (stream 6) into the parse. This workflow is
# object-based: it captures the reconciler's returned [pscustomobject]
# rows from the success stream (stream 1) and filters on
# .Category / .Name / .Reason -- no stdout/stderr text scraping.
#
# Read-only against the tenant. The reconciler is invoked with
# -DirectionPolicy audit, which forces $WhatIfPreference so every
# New-/Set-/Remove-InsiderRiskPolicy write short-circuits to its
# "Would ..." branch. No write fires under any circumstance
# (docs/adr/0029-source-of-truth-direction-policy.md). Per security
# principle #9 and mcp-tool-usage.instructions.md read-only default,
# this workflow never invokes the apply path.
#
# Skip baseline is a POST-FILTER, not -SkipNames. -SkipNames is inert
# in audit mode (the audit short-circuit runs before the ADR 0029
# skip pass in Deploy-IRMPolicies.ps1), so this workflow does NOT pass
# -SkipNames to the script. It instead removes the ADR 0036 skip
# baseline names from the returned object rows after the fact. The
# baseline default mirrors the `skip_names_irm` default in
# deploy-irm.yml verbatim -- a TWO-way byte-lockstep, reduced from
# three-way when ADR 0051 retired deploy-data-plane.yml (the 4
# operator-authored mid-testing policies; the system-managed
# IRM_Tenant_Setting_* container was dropped from the baseline as
# redundant on 2026-07-12, see
# docs/adr/0036-irm-tenant-setting-immovable.md).
#
# Self-provisioned issue labels: `gh issue create --label <name>`
# fails the entire call (and creates nothing) if any referenced label
# is missing -- a fresh fork lacks the `drift-detected` label. The
# issue step therefore reads the existing label set, creates only the
# missing labels, then creates the issue.
#
# Federated credential reuse: the gh-oidc-purview-data-plane app's
# federated credential is scoped to
# `repo:<org>/<repo>:environment:<environment>`
# (per ADR 0010). Because this job declares the selected `environment:`
# (ADR 0057), no new
# federated credential subject is required for the schedule trigger.
#
# Key Vault access: the runner principal signs the IPPS client_assertion
# JWT via `az keyvault key sign` against the lab vault (resolved from
# vars.KEY_VAULT_NAME). The vault is private-network by default; the
# workflow temp-opens its public endpoint for the duration of the
# audit read and restores it via an `if: always()` step. The 30-second
# sleep matches the sibling sync workflows.
#
# References (Microsoft Learn, GitHub Docs):
#   https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
#   https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust
#   https://learn.microsoft.com/en-us/powershell/exchange/connect-to-scc-powershell
#   https://learn.microsoft.com/en-us/powershell/exchange/app-only-auth-powershell-v2
#   https://learn.microsoft.com/en-us/powershell/module/exchange/get-insiderriskpolicy
#   https://learn.microsoft.com/en-us/purview/insider-risk-management
#   https://learn.microsoft.com/en-us/cli/azure/keyvault#az-keyvault-update
#   https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
#   https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
#   https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability
#   https://cli.github.com/manual/gh_issue_create
#   https://cli.github.com/manual/gh_label_create
#
# This is IRM's slice of issue #167, which tracks the same gap across the
# four sibling sync-from-tenant workflows. sync-dlp-from-tenant.yml got the
# first one under #164; the remaining three (labels, label-policies,
# auto-label-policies) stay on #167.
#
# Trade-off, accepted deliberately and identical to the DLP leg: the
# dispatched run's own preflight still applies ADR 0054's onboarding-signal
# check, but NOT ADR 0060's CI_DATA_PLANE_ENABLED gate, because that gate is
# defined to apply only to the `schedule` event and the dispatched run's
# event is `workflow_dispatch`. This matches how an operator's manual
# dispatch has always behaved: a governance lock fails the dispatched run
# loudly rather than skipping silently a second time.
#
# Skip gate (ADR 0054): this schedule-triggered workflow fires on every
# un-onboarded template copy, including this repository itself, and
# unconditionally assumed a real Purview tenant was wired up. The
# `preflight` job below tests the onboarding signal (a non-empty
# secrets.AZURE_CLIENT_ID and vars.KEY_VAULT_NAME on the selected
# GitHub Environment) from inside a running job -- `secrets` is not
# available in ANY `if:` condition, only in env/run/with -- and emits a
# `configured` output. The `sync` job below declares `needs: preflight`
# and `if: needs.preflight.outputs.configured == 'true'` (`needs` IS
# available in a job-level `if:`), so an un-onboarded copy SKIPS this
# job cleanly instead of failing at azure/login. This also folds in the
# KEY_VAULT_NAME throw guard that previously lived in the "Temporarily
# allow Key Vault public access" step.
#
# ADR 0060: the same preflight step additionally skips a *scheduled* run
# (not a manual workflow_dispatch) when vars.CI_DATA_PLANE_ENABLED is
# 'false' on the selected Environment -- the owner's switch to silence a
# governance-locked tenant's daily failing cron instead of leaving it red
# and unexplained. Absent or any other value keeps the current
# attempt-and-fail-if-blocked behavior.

on:
  schedule:
    # Daily at 08:00 UTC. Offset one hour after the 07:00 DLP drift-back
    # slot (sync-dlp-from-tenant.yml) so the IRM audit runs after the
    # DLP surface, not concurrently with it. GitHub Actions runs
    # scheduled workflows independently per workflow file. Cron grammar:
    # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: >-
          Target deployment environment (GitHub Environment name).
          Defaults to lab. Push/schedule runs map branch dev -> dev and
          every other branch -> lab (ADR 0057).
        type: choice
        options:
          - lab
          - dev
        default: lab
        required: false
      skip_names_irm:
        description: |
          Comma-separated list of Insider Risk Management policy names
          to suppress from the drift report. Applied as a POST-FILTER on
          the reconciler's returned object rows (NOT passed to the
          script -- -SkipNames is inert in audit mode). Case-insensitive;
          whitespace around commas is trimmed. The default carries the 4
          operator-authored `IRM Lab — *` policy names ratified as
          permanent skip in
          docs/adr/0036-irm-tenant-setting-immovable.md under the issue
          #603 hard rule (mid-testing window). The system-managed
          `IRM_Tenant_Setting_<tenant-guid>` policy is NOT baselined
          here: the reconciler classifies it NoChange via a name-prefix
          wildcard, so it never plans a mutation regardless of this list.
          Keep this default in lockstep with the `skip_names_irm` default
          in deploy-irm.yml (a TWO-way lockstep since ADR 0051 retired
          deploy-data-plane.yml) and ADR 0036's source-of-truth table.
        type: string
        default: 'IRM Lab — Data leaks by priority users,IRM Lab — Data theft by departing users,IRM Lab — General data leaks,IRM Lab — Risky AI usage'
        required: false

# Least-privilege. No `pull-requests` scope -- this Tier-3 surface opens
# an ISSUE, not a PR.
permissions:
  id-token: write           # OIDC token for azure/login@v2.
  contents: read            # Checkout only; no writes.
  issues: write             # gh issue create / gh label create when drift detected.

concurrency:
  group: sync-irm-${{ inputs.environment || (github.ref_name == 'dev' && 'dev' || 'lab') }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (ADR 0054 onboarding signal)
    runs-on: ubuntu-latest
    # Binds the SAME selected environment as sync below (ADR 0057
    # canonical expression, byte-identical), so the secret and variable
    # it tests are the exact ones sync would use.
    environment: ${{ inputs.environment || (github.ref_name == 'dev' && 'dev' || 'lab') }}
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      # secrets/vars are legal in jobs.<job_id>.env (not in jobs.<job_id>.if
      # or jobs.<job_id>.steps.if) -- see ADR 0054.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      # ADR 0060: lets a governance-locked tenant's owner silence this
      # workflow's daily scheduled failure instead of it going
      # unexplained-red forever. Only applies to the schedule trigger -- a
      # manual workflow_dispatch run still attempts the tenant call even
      # when this is 'false', so the owner can test after a policy
      # exemption is granted.
      CI_DATA_PLANE_ENABLED: ${{ vars.CI_DATA_PLANE_ENABLED }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Check onboarding signal
        id: check
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:AZURE_CLIENT_ID)) {
            Write-Host "::warning::secrets.AZURE_CLIENT_ID is not set on this GitHub Environment. This copy is not onboarded to a Purview tenant (ADR 0054) -- skipping the tenant-touching job."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "configured=false"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## NOT VERIFIED -- the tenant was not contacted`n`nThis run skipped its tenant-touching job, so it checked nothing. A green tick here means the run completed, **not** that the tenant matches this repository. See issue #245."
          } elseif ([string]::IsNullOrEmpty($env:KEY_VAULT_NAME)) {
            Write-Host "::warning::vars.KEY_VAULT_NAME is not set on this GitHub Environment. This copy is not onboarded to a Purview tenant (ADR 0054) -- skipping the tenant-touching job."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "configured=false"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## NOT VERIFIED -- the tenant was not contacted`n`nThis run skipped its tenant-touching job, so it checked nothing. A green tick here means the run completed, **not** that the tenant matches this repository. See issue #245."
          } elseif ($env:EVENT_NAME -eq 'schedule' -and $env:CI_DATA_PLANE_ENABLED -eq 'false') {
            Write-Host "::warning::vars.CI_DATA_PLANE_ENABLED is 'false' on this GitHub Environment (ADR 0060) -- skipping this scheduled tenant-touching run. Trigger workflow_dispatch manually to run anyway."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "configured=false"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## NOT VERIFIED -- the tenant was not contacted`n`nThis run skipped its tenant-touching job, so it checked nothing. A green tick here means the run completed, **not** that the tenant matches this repository. See issue #245."
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "configured=true"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Tenant-touching job will run`n`nPreflight passed, so this run contacts the tenant. Whether it verified clean is reported by that job, not here."
          }

  sync:
    name: Detect IRM policy drift from tenant
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'dev' && 'dev' || 'lab') }}
    env:
      ENVIRONMENT_NAME: ${{ inputs.environment || (github.ref_name == 'dev' && 'dev' || 'lab') }}
      # Reconciler parameters-file override (ADR 0057): every
      # Deploy-*.ps1 / Export-*.ps1 honors PURVIEW_PARAMETERS_FILE when
      # -ParametersFile is not passed explicitly.
      PURVIEW_PARAMETERS_FILE: infra/parameters/${{ inputs.environment || (github.ref_name == 'dev' && 'dev' || 'lab') }}.yaml
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Install-Module powershell-yaml -Force -Scope CurrentUser
          # Connect-IPPSSession -AccessToken requires ExchangeOnlineManagement
          # v3.8.0-Preview1+; -AllowPrerelease until GA. Mirrors
          # sync-dlp-from-tenant.yml.
          # Reference: https://learn.microsoft.com/en-us/powershell/exchange/exchange-online-powershell-v2
          Install-Module ExchangeOnlineManagement -Force -Scope CurrentUser -AllowPrerelease

      # Ownership-aware open. `opened` is true ONLY when this run is the
      # one that changed the vault from locked to open, so only that run
      # re-locks it on exit. The step this replaces wrote `opened=true`
      # unconditionally, which made every run in a fan-out re-lock and
      # strand the stragglers -- see the action for the measurements
      # behind that (issues #306, #311).
      - name: Temporarily allow Key Vault public access
        id: kv-open
        uses: ./.github/actions/open-key-vault-firewall
        with:
          key-vault-name: ${{ env.KEY_VAULT_NAME }}
          propagation-seconds: '30'

      - name: Detect IRM drift in ADR 0029 audit mode
        id: detect
        shell: pwsh
        env:
          SKIP_NAMES_IRM: ${{ inputs.skip_names_irm || 'IRM Lab — Data leaks by priority users,IRM Lab — Data theft by departing users,IRM Lab — General data leaks,IRM Lab — Risky AI usage' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runUrl = $env:RUN_URL

          # Build the skip baseline as an ordinal-insensitive set. This
          # is a POST-FILTER on the returned object rows. We do NOT pass
          # -SkipNames to the script: -SkipNames is inert in audit mode
          # because Deploy-IRMPolicies.ps1's audit short-circuit runs
          # before its ADR 0029 skip pass.
          # Reference: docs/adr/0036-irm-tenant-setting-immovable.md
          $skipSet = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::OrdinalIgnoreCase)
          if (-not [string]::IsNullOrWhiteSpace($env:SKIP_NAMES_IRM)) {
            foreach ($n in ($env:SKIP_NAMES_IRM -split ',')) {
              $t = $n.Trim()
              if ($t) { [void]$skipSet.Add($t) }
            }
          }
          Write-Host "Skip baseline count = $($skipSet.Count)"

          # Object-based detection. Capture ONLY the success stream
          # (stream 1) -- the reconciler returns its categorized
          # [pscustomobject] rows (.Category / .Name / .Reason) as the
          # pipeline output; its progress lines go to the Information
          # stream (6) and are not captured here. -DirectionPolicy audit
          # forces read-only ($WhatIfPreference); no write fires.
          # Reference: docs/adr/0029-source-of-truth-direction-policy.md
          #
          # -Confirm:$false is REQUIRED, not decorative, and it is NOT made
          # redundant by `-DirectionPolicy audit`. Deploy-IRMPolicies.ps1's
          # audit short-circuit does NOT return: it sets
          # `$WhatIfPreference = $true` and FALLS THROUGH into the plan +
          # gate + apply region. The ADR 0052 gate is therefore REACHED under
          # audit, and stays silent only because the gate's -IsWhatIf argument
          # happens to be bound to $WhatIfPreference. That is a load-bearing
          # coincidence, not a guarantee -- issue #106 is a live bug of exactly
          # the class where an audit short-circuit fails to neutralize the
          # writes. Without this binding, one refactor of that short-circuit
          # turns this step into a confirmation prompt that nobody can answer
          # on a hosted runner.
          # Reference: docs/adr/0052-destructive-confirmation-gate-at-script-layer.md
          $rows = @(./scripts/Deploy-IRMPolicies.ps1 -DirectionPolicy audit -Confirm:$false)

          # Drift = "would change" categories, minus the skip baseline.
          # In audit mode the reconciler emits Create / Update / Orphan
          # for would-be writes, NoChange for in-sync, Failed for caught
          # exceptions. NoChange and Skipped are never drift.
          # Blocked (issue #177) is drift the service cannot satisfy in
          # place -- an immutable `scenario` difference, which
          # Set-InsiderRiskPolicy has no parameter to write. It needs a
          # human decision (recreate the policy or correct the YAML), so
          # it must raise an issue rather than pass silently.
          $driftCategories = @('Create', 'Update', 'Orphan', 'Failed', 'Blocked')
          $drift = @($rows | Where-Object {
            $_.Category -in $driftCategories -and
            -not $skipSet.Contains([string]$_.Name)
          })

          Write-Host "Returned rows = $($rows.Count); drift rows = $($drift.Count)"

          if ($drift.Count -eq 0) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'drift=false'
            Write-Host '::notice::No IRM policy drift detected. Tenant matches data-plane/irm/policies.yaml (skip baseline suppressed).'
            return
          }

          # Build a readable Markdown table for the issue body.
          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine('## Summary')
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine("The scheduled Insider Risk Management reverse drift-detection companion detected drift between the desired-state ``data-plane/irm/policies.yaml`` and the live tenant behind the ``$($env:ENVIRONMENT_NAME)`` environment.")
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine('This issue was opened automatically by `.github/workflows/sync-irm-from-tenant.yml`.')
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine('> **Read-only.** Drift was detected in ADR 0029 **audit mode** (`-DirectionPolicy audit`). No `New-`/`Set-`/`Remove-InsiderRiskPolicy` write fired against the tenant. This is a report, not a change.')
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine('## Drift report')
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine('| Category | Name | Reason |')
          [void]$sb.AppendLine('|---|---|---|')
          foreach ($d in $drift) {
            $name   = ([string]$d.Name)   -replace '\|', '\|'
            $reason = ([string]$d.Reason) -replace '\|', '\|'
            [void]$sb.AppendLine("| $($d.Category) | $name | $reason |")
          }
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine('## Why an issue and not a pull request')
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine('`scripts/Deploy-IRMPolicies.ps1` does expose `-ExportCurrentState`, so a re-export PR is technically possible here. This workflow deliberately stops at an issue anyway, because it is not the only producer on this surface: `deploy-irm.yml` already opens a drift-back PR on `auto/irm-portal-wins-drift-<environment>` whenever its portal-wins apply skips something, and `scripts/Invoke-LocalIrmDriftSync.ps1` opens one on `auto/irm-drift-sync-<environment>` for a governance-locked tenant that no workflow can reach. A third producer proposing the same YAML from a schedule would race the other two for the same file.')
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine('There is also a filtering asymmetry to respect: this job post-filters the ADR 0036 skip baseline out of the drift rows, whereas the exporter captures every tenant policy except `IRM_Tenant_Setting_*`. An export-and-diff conversion would therefore have to re-apply that filter to the exported YAML before diffing it, or it would propose changes this job deliberately ignores.')
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine('## Next steps')
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine('1. Review this run for the full audit-mode plan: ' + $runUrl)
          [void]$sb.AppendLine('2. Decide how to reconcile each drifted policy:')
          [void]$sb.AppendLine('   - **Accept into source** — add / update the entry in `data-plane/irm/policies.yaml`, then let `deploy-irm.yml` converge (it applies on merge via its `push:` path trigger).')
          [void]$sb.AppendLine('   - **Overwrite the portal** — dispatch `deploy-irm.yml` with `irm_direction_policy=repo-wins` and the typed `confirm_overwrite_irm=overwrite portal` token.')
          [void]$sb.AppendLine('   - **Ratify the deviation** — extend the `skip_names_irm` baseline (and ADR 0036) if the policy is intentionally portal-owned.')
          [void]$sb.AppendLine('   - **Let a drift-back PR carry it** — on a tenant CI can reach, dispatch `deploy-irm.yml` under `portal-wins`, which re-exports and opens the PR for you; on a governance-locked tenant, run `scripts/Invoke-LocalIrmDriftSync.ps1` locally (see `docs/runbooks/irm-local-drift-sync.md`).')
          [void]$sb.AppendLine('3. Close this issue once the drift is resolved. The next scheduled run reopens a fresh issue only if drift remains.')
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine('## References')
          [void]$sb.AppendLine('')
          [void]$sb.AppendLine('- [ADR 0029 — Source-of-truth direction policy](../blob/main/docs/adr/0029-source-of-truth-direction-policy.md)')
          [void]$sb.AppendLine('- [ADR 0036 — IRM tenant-setting immovable](../blob/main/docs/adr/0036-irm-tenant-setting-immovable.md)')
          [void]$sb.AppendLine('- [Microsoft Purview Insider Risk Management](https://learn.microsoft.com/en-us/purview/insider-risk-management)')

          Set-Content -Path irm-drift-issue-body.md -Value $sb.ToString() -Encoding utf8

          Add-Content -Path $env:GITHUB_OUTPUT -Value 'drift=true'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "count=$($drift.Count)"
          Write-Host "::warning::IRM policy drift detected ($($drift.Count) object(s)). An issue will be opened."
        # $runUrl is provided via env so the interpolation stays outside
        # the run shell-quoting boundary.
        # Reference: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections

      - name: Open or refresh drift-detection issue
        if: steps.detect.outputs.drift == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRIFT_COUNT: ${{ steps.detect.outputs.count }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Self-provision issue labels. `gh issue create --label <name>`
          # fails the whole call if any referenced label is missing, and
          # `gh label create` fails on an existing label -- so create
          # ONLY the missing ones.
          # Reference: https://cli.github.com/manual/gh_label_create
          $wanted = @{
            'drift-detected'            = @{ color = 'B60205'; desc = 'Drift detected between desired-state YAML and the live tenant' }
            'needs-review'              = @{ color = 'FBCA04'; desc = 'Awaiting lab-owner review' }
            'squad:automation-engineer' = @{ color = '0E8A16'; desc = 'Owned by the Automation Engineer squad persona' }
          }
          $existing = @(gh label list --limit 200 --json name --jq '.[].name')
          $existingSet = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::OrdinalIgnoreCase)
          foreach ($e in $existing) { [void]$existingSet.Add($e) }

          foreach ($name in $wanted.Keys) {
            if ($existingSet.Contains($name)) {
              Write-Host "Label '$name' already exists; skipping create."
              continue
            }
            $meta = $wanted[$name]
            Write-Host "Creating missing label '$name'."
            gh label create $name --color $meta.color --description $meta.desc
          }

          # Idempotency guard: if an open drift issue for this surface
          # already exists, refresh it with a comment instead of opening
          # a duplicate. The search is scoped to the FULL title (quoted
          # exact phrase, which GitHub's search syntax treats as a phrase
          # match) rather than the bare substring "IRM policy drift" --
          # the bare form has no environment token, so an open `lab`
          # drift issue would silently absorb `dev`'s drift as a refresh
          # comment instead of opening its own (issue #190 finding).
          $title = "IRM policy drift detected in the $($env:ENVIRONMENT_NAME) environment tenant"
          $searchQuery = "`"$title`" in:title"
          # `// empty` so an empty result set yields no output (not the
          # literal string "null", which is truthy in PowerShell).
          $open = (gh issue list `
            --state open `
            --label 'drift-detected' `
            --label 'squad:automation-engineer' `
            --search $searchQuery `
            --json number `
            --jq '.[0].number // empty' | Out-String).Trim()

          if ($open) {
            Write-Host "::notice::Open IRM drift issue #$open already exists; adding a refresh comment."
            $comment = "Drift still present as of the latest scheduled audit-mode run ($($env:DRIFT_COUNT) object(s)). See $($env:RUN_URL)."
            gh issue comment $open --body $comment
          } else {
            $new = gh issue create `
              --title $title `
              --body-file irm-drift-issue-body.md `
              --label 'drift-detected' `
              --label 'needs-review' `
              --label 'squad:automation-engineer'
            Write-Host "::notice::Opened IRM drift issue: $new"
          }

      - name: Restore Key Vault network defaults
        # `opened` is true only for the run that actually changed the vault
        # from locked to open. KV_REOPENED_BY_RETRY covers the other way a
        # run can become responsible for the window: the #306 retry in
        # Get-PurviewIPPSAccessToken.ps1 re-opening a vault a sibling closed
        # mid-run. Without that second clause a retry could leave the vault
        # open with nobody owning it (issues #306, #311).
        if: always() && (steps.kv-open.outputs.opened == 'true' || env.KV_REOPENED_BY_RETRY == 'true')
        shell: pwsh
        run: |
          # Reference: https://learn.microsoft.com/en-us/cli/azure/keyvault#az-keyvault-update
          az keyvault update `
            --name $env:KEY_VAULT_NAME `
            --public-network-access Disabled `
            --default-action Deny `
            --only-show-errors `
            -o none

      - name: Summarize result
        if: always()
        shell: pwsh
        env:
          DRIFT_DETECTED: ${{ steps.detect.outputs.drift }}
          DRIFT_COUNT: ${{ steps.detect.outputs.count }}
        run: |
          if ($env:DRIFT_DETECTED -eq 'true') {
            Write-Host "::notice::IRM drift detected ($($env:DRIFT_COUNT) object(s)). Review the issue for details."
          } elseif ($env:DRIFT_DETECTED -eq 'false') {
            Write-Host "::notice::No IRM drift detected. Tenant matches desired state."
          } else {
            Write-Host "::warning::IRM drift detection did not complete (job failed before the detect step finished)."
          }
