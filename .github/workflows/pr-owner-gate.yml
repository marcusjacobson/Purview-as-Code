name: PR Owner Gate

# Intentionally NOT gated to actor.login. The sticky comment communicates
# PR readiness state to any contributor and to the lab owner; it does not
# itself apply `owner-approved` (that is `pr-auto-merge.yml`, which IS
# gated to actor.login == 'contoso').

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled, unlabeled]

# One run per PR at a time (#137). Without this the "sticky" comment is not sticky: `opened` and
# `labeled` fire together, both runs list the comments before either has posted, both find nothing,
# and both create -- 3 accumulated on #129, 2 each on #134 and #135. Serialising per PR makes the
# lookup see the earlier run's comment and update it. `cancel-in-progress` is safe here because the
# comment is a full restatement of current state, not an increment, so a superseded run has nothing
# worth finishing.
# Reference: https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: pr-owner-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  statuses: write
  checks: write

jobs:
  # The job key MUST be a valid GitHub Actions identifier
  # (`[a-zA-Z_][a-zA-Z0-9_-]*`); spaces in the key make every push event
  # produce a zero-jobs failed workflow_run. See issue #115.
  # Reference: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_id
  #
  # The user-visible job name (and the string a future branch-protection
  # rule would reference under `required_status_checks.contexts`) is set
  # by the `name:` field below — keep it in sync with any branch
  # protection rule that names this check.
  # Reference: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idname
  sticky-owner-prompt:
    name: Sticky owner approval prompt
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Get PR context
        id: pr-context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for this event. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Guarded because the step runs under `bash -e`: a bare `VAR=$(gh ...)` aborts the whole
          # step when the call fails, which red-checks a PR that is otherwise perfectly healthy.
          # This job only posts an advisory comment -- a transient API blip must degrade to
          # "say nothing", never to a failed check or a comment built on labels we never read.
          if ! LABELS=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json labels \
            --jq '.labels[].name' 2>&1); then
            echo "::warning::Could not read labels for PR #$PR_NUMBER; skipping the owner prompt for this run. Response: $LABELS"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "labels<<EOF"
            echo "$LABELS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          HAS_NEEDS_REVIEW=$(echo "$LABELS" | grep -c "needs-review" || true)
          HAS_APPROVED=$(echo "$LABELS" | grep -c "owner-approved" || true)
          echo "has_needs_review=$HAS_NEEDS_REVIEW" >> "$GITHUB_OUTPUT"
          echo "has_approved=$HAS_APPROVED" >> "$GITHUB_OUTPUT"

      - name: Determine check state
        id: check-state
        if: steps.pr-context.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr-context.outputs.pr_number }}"

          # Same reason as the labels read above, and this is the one that actually bit: on PR #138
          # a 503 here aborted the step under `bash -e` BEFORE reaching the guarded rollup call
          # below, so the first cut of this fix still red-checked the PR. Guarding one call in a
          # step and not the one above it guards nothing.
          if ! HEAD_SHA=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json headRefOid \
            --jq '.headRefOid' 2>&1); then
            echo "::warning::Could not resolve the head SHA for PR #$PR_NUMBER; reporting checks as still running. Response: $HEAD_SHA"
            echo "checks_state=running" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # `|| echo ""` LOOKS like a guard but is not: gh writes the error body to stdout, so on
          # failure $CHECKS was the body followed by an empty string, and the greps below then ran
          # against a JSON error object. A body matching neither pattern fell through to
          # `passing` -- reporting "all checks are passing" because the API call FAILED (#137).
          # Check the status, and degrade to `running`, never to `passing`: "still working" is the
          # only honest thing to say when the rollup could not be read, and it is the state that
          # does not invite an approval.
          if CHECKS=$(gh api \
            "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" \
            --jq '.check_runs[] | select(.name != "Sticky owner approval prompt") | .conclusion' 2>&1); then
            if echo "$CHECKS" | grep -q "failure"; then
              echo "checks_state=failing" >> "$GITHUB_OUTPUT"
            elif echo "$CHECKS" | grep -q "null"; then
              echo "checks_state=running" >> "$GITHUB_OUTPUT"
            else
              echo "checks_state=passing" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Could not read check runs for $HEAD_SHA; reporting as still running. Response: $CHECKS"
            echo "checks_state=running" >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert sticky comment
        if: steps.pr-context.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr-context.outputs.pr_number }}"
          HAS_NEEDS_REVIEW="${{ steps.pr-context.outputs.has_needs_review }}"
          HAS_APPROVED="${{ steps.pr-context.outputs.has_approved }}"
          CHECKS_STATE="${{ steps.check-state.outputs.checks_state }}"
          MARKER="<!-- pr-owner-gate:prompt -->"

          if [ "$HAS_APPROVED" -gt 0 ]; then
            STATE_MSG="**This PR has been approved by the lab owner.** The \`owner-approved\` label has been applied. The \`pr-auto-merge\` workflow will enable auto-merge with squash."
          elif [ "$HAS_NEEDS_REVIEW" = "0" ]; then
            STATE_MSG="**Missing \`needs-review\` label.** This PR was not filed through \`@idea-intake\`. Add the label manually if this is intentional."
          elif [ "$CHECKS_STATE" = "running" ]; then
            STATE_MSG="**Checks are running.** Waiting for all status checks to complete before owner approval is available."
          elif [ "$CHECKS_STATE" = "failing" ]; then
            STATE_MSG="**One or more checks are failing.** Please resolve check failures before requesting owner approval."
          else
            STATE_MSG="**Ready for lab-owner approval.** All checks are passing and this PR carries \`needs-review\`."$'\n\n'"To approve, run \`@owner-approval\` in Copilot Chat, or run:"$'\n'"\`\`\`"$'\n'"gh pr edit $PR_NUMBER --add-label owner-approved"$'\n'"\`\`\`"
          fi

          COMMENT_BODY="${MARKER}

          ## Owner Gate

          ${STATE_MSG}

          ---
          *This comment is maintained automatically by the \`pr-owner-gate\` workflow. It updates on every push and label change. Re-toggle the \`needs-review\` label to refresh after a check completes.*"

          # `gh api` prints the RESPONSE BODY to stdout even on an HTTP error. The previous form
          # discarded stderr and never checked the exit code, so a failed lookup was captured as
          # data: during the 2026-08-17 incident a 403 body became $EXISTING_ID and the script
          # PATCHed `.../issues/comments/{"message":"Resource not accessible...}` (#137).
          # Capture status explicitly, warn with what actually came back, and fall back to the
          # SAFE branch -- posting a fresh comment is a cosmetic duplicate; a corrupt PATCH is a
          # failed job on a PR that is otherwise fine.
          if LOOKUP_OUT=$(gh api \
            "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" 2>&1); then
            EXISTING_ID=$(printf '%s\n' "$LOOKUP_OUT" | head -1)
          else
            echo "::warning::Could not list comments on PR #$PR_NUMBER; posting a new prompt instead of updating. Response: $LOOKUP_OUT"
            EXISTING_ID=""
          fi

          # Shape guard, independent of the exit code above: a comment id is all digits. Anything
          # else -- an error blob, a jq diagnostic, a partial line -- can never reach the URL.
          case "$EXISTING_ID" in
            ''|*[!0-9]*) EXISTING_ID="" ;;
          esac

          if [ -n "$EXISTING_ID" ]; then
            gh api -X PATCH \
              "repos/${{ github.repository }}/issues/comments/$EXISTING_ID" \
              -f body="$COMMENT_BODY"
          else
            gh pr comment "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --body "$COMMENT_BODY"
          fi

      - name: Report check result
        if: steps.pr-context.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HAS_APPROVED="${{ steps.pr-context.outputs.has_approved }}"

          if [ "$HAS_APPROVED" -gt 0 ]; then
            echo "Owner approval confirmed. Check passes."
            exit 0
          else
            echo "Awaiting owner approval."
            exit 0
          fi
